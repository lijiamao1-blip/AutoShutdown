# 自动编译 + 测试：每次推送代码或提交 PR 时，在 GitHub 的 Windows 云端机器上运行。
# 测试只使用替身（fake）电源接口，不会真的关机；
# 需要真机的验收测试（Category=RealMachine，且需 S18_REALMACHINE=1）在这里一律排除。
name: CI

on:
  push:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  build-and-test:
    name: 编译与测试 (Windows)
    runs-on: windows-latest
    timeout-minutes: 40

    steps:
      - name: 拉取代码
        uses: actions/checkout@v5

      # global.json 要求 10.0.100 以上的 .NET 10 SDK（rollForward=latestFeature）；
      # 安装 10.0 最新补丁，其自带运行时满足 Directory.Build.props 里的 RuntimeFrameworkVersion。
      - name: 安装 .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: 还原依赖
        run: dotnet restore AutoShutdown.sln

      - name: 编译 (Release，警告即错误)
        run: dotnet build AutoShutdown.sln --configuration Release --no-restore

      # 很多测试带 2 秒硬超时（[Fact(Timeout = 2000)]）。云端机器核数少，
      # 测试集合并行时会互相抢 CPU，导致每次随机有 1~2 个测试超时。
      # 这里改为按顺序执行测试集合，结果才稳定可信。
      - name: 运行测试
        run: >
          dotnet test AutoShutdown.sln
          --configuration Release
          --no-build
          --filter "Category!=RealMachine"
          --logger "trx;LogFileName=test-results.trx"
          --results-directory TestResults
          -- xUnit.ParallelizeTestCollections=false

      - name: 上传测试结果
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: test-results
          path: TestResults/
          if-no-files-found: ignore
